s3(){say('',`La música se detiene. No baja: se detiene. En el silencio, cada casa de la calle Marrow se inclina un poco hacia ti, como si quisiera oírte mejor.`,()=>say('',`Las sonrisas de las calabazas se quedan fijas. Las ventanas se apagan una a una. Por primera vez en toda la noche ves a los vecinos sin sonreír. Quizá sea la primera vez que los ves de verdad.`,()=>say('',`Algo en la calle ya te está buscando. Pero las ventanas de las casas guardan lo que pasó aquí. Asómate a ellas. Necesitas saberlo.`,()=>log(`Ya no es Halloween. Las ventanas de las casas guardan la verdad: hay que asomarse.`))))},
m1(){say('',`Todas las luces de los porches parpadean a la vez. Los vecinos se detienen en sus ventanas, quietos, mirándote. A tu espalda oyes pasos: son los tuyos, pero llegan un segundo tarde.`,()=>log(`Mis pasos llegan un segundo tarde. Los vecinos dejaron de moverse.`))},
m2(){say('',`Entre el nº 7 y el nº 9 hay una casa que antes no estaba: el nº 13½. Tiene la puerta abierta y dentro se ve tu cuarto, tal como lo dejaste. Cuando te acercas, la calle se alarga y nunca llegas.`,()=>log(`El nº 13½ existe en el mapa y no en la calle. Dentro estaba mi cuarto.`))},
m3(){say('',`El desagüe de la calle Marrow se abre en mitad del asfalto, sin ruido, como una boca. De él sube tu nombre dicho por todos los vecinos a la vez. Cuando termina, en la casa sin número se enciende una luz.`,()=>log(`El desagüe se abrió y pronunció mi nombre con todas las voces. En la casa sin número se encendió una luz.`))},
chase(){say('',`Todas las luces de los porches se apagan a la vez. Calle abajo se enciende una única linterna. Camina. Tienes que llegar al nº 13, muy al OESTE, pero su puerta tiene la llave echada. Bajo una farola encendida estás a salvo. Mantén F para alzar tu linterna: no puede moverse mientras lo miras.`,startChase)},
mid(){say('',`Suena el último timbre de la calle Marrow. A tu espalda. Todas las casas suenan una tras otra, como una frase leída en voz alta.`,()=>addFear(7.5-S.fear))}};

const RU={"(Desde dentro, muy suave) «Cielo, la llave... la dejaste en casa. En tu casa. La casa sin número. Date prisa, que ya viene».": "(Изнутри, очень тихо) «Милая, ключ... ты оставила его дома. В своём доме. В доме без номера. Скорее, он уже идёт».", "(I: bolsa. J: diario. M: mapa. Mantén F: linterna.) Empieza por la luz dorada del porche del nº 13, a tu espalda, a la derecha.": "(I: сумка. J: дневник. M: карта. Удерживай F: фонарь.) Начни с золотого света на крыльце дома № 13, позади тебя справа.", "(La voz de Juno, muy pequeña: «no».)": "(Голос Юно, совсем тихий: «нет».)", "(No dice nada. Su sonrisa tallada parpadea amistosa. ¡Su abrigo está remendado con envoltorios de caramelo!)": "(Он ничего не говорит. Его вырезанная улыбка дружелюбно мерцает. Пальто залатано обёртками от конфет!)", "(la salida está a la izquierda)": "(выход — слева)", ".-- .-. . -.  ...Está deletreando algo, una y otra vez.": ".-- .-. . -.  ...Он что-то выписывает, снова и снова.", "...ren. ...ren. ...vuelve a casa, Wren. Es la voz de la abuela Wick, pero lejana y muy pequeña.": "...рен. ...рен. ...вернись домой, Рен. Это голос бабушки Уик, но далёкий и совсем тихий.", "31 de octubre. ¡La noche más feliz del año! Eres Wren, un zorrito muy pequeño con un cubo muy grande.": "31 октября. Самая счастливая ночь в году! Ты — Рен, крошечный {d} с огромным ведёрком.", ": busca la llave o tírate por la ventana.": ": найди ключ или выпрыгни в окно.", "A tu espalda, el Hombre del Farol se detiene. Está hecho de todas las luces que alguien dejó encendidas por quien no volvió a casa.": "За твоей спиной Человек-Фонарь останавливается. Он сделан из всех огней, оставленных гореть для тех, кто не вернулся домой.", "Abres los ojos. Todavía queda noche. Lo que te mató sigue ahí fuera, esperando.": "Ты открываешь глаза. Ночь ещё не кончилась. То, что тебя убило, всё ещё где-то там и ждёт.", "Abuela Wick": "Бабушка Уик", "Acariciar a Biscuit": "Погладить Бисквита", "Acariciar la calabaza": "Погладить тыкву", "Acercarte y escuchar": "Подойти и послушать", "Ahora eres un BOT:": "Теперь ты БОТ:", "Ahora eres:": "Теперь ты:", "Ahora está vacío.": "Теперь тут пусто.", "Ahora solo queda el viento en la tubería.": "Теперь в трубе остался только ветер.", "Algo en la calle ya te está buscando. Pero las ventanas de las casas guardan lo que pasó aquí. Asómate a ellas. Necesitas saberlo.": "Что-то на улице уже ищет тебя. Но окна домов хранят то, что здесь случилось. Загляни в них. Ты должен это узнать.", "Algo pequeño y frío roza tu cuerpo. Cuando miras, estás de vuelta junto a la puerta de entrada de la sala, y la oscuridad se ríe.": "Что-то маленькое и холодное касается тебя. Ты оглядываешься — и ты у входа в комнату, а темнота хихикает.", "Algo va mal. Mira con atención.": "Что-то не так. Смотри внимательнее.", "Alguien lo ha masticado antes que tú.": "Кто-то жевал её до тебя.", "Anda, cómetelo. Saben mejor cuando dejas de preguntar.": "Давай, съешь. Они вкуснее, когда перестаёшь спрашивать.", "Aparté la vista. Sentí que seguía saludando.": "Я отвёл взгляд. Я чувствовал, что он всё ещё машет.", "Asómate a las ventanas de las casas. Entiende qué pasó.": "Загляни в окна домов. Пойми, что произошло.", "Asómate a las ventanas de las casas. Y no te comas todos los caramelos.": "Загляни в окна домов. И не съедай все конфеты.", "Atrás": "Назад", "Aún no puedo curarte otra vez. Vuelve dentro de un momento.": "Я пока не могу снова тебя починить. Вернись чуть позже.", "Aún quedan puertas cerradas en la calle Marrow.": "На улице Марроу ещё остались закрытые двери.", "BY:EPG. Escrito, dibujado y compuesto por el Turno de Noche. Caramelos: la Sra. Pim. Música: la primera nota, del Sr. Bellows. Gracias especiales a la luz del porche.": "BY:EPG. Написано, нарисовано и сочинено Ночной Сменой. Конфеты: миссис Пим. Музыка: первая нота мистера Беллоуза. Особая благодарность свету на крыльце.", "Biscuit me llevó a una tabla suelta de la valla, al final de la calle.": "Бисквит привёл меня к расшатанной доске забора в конце улицы.", "Biscuit te ha seguido por cuatro calles. No ha parpadeado ni una vez.": "Бисквит прошла за тобой четыре улицы. Она ни разу не моргнула.", "Biscuit te mira como si esperara que recordaras algo.": "Бисквит смотрит так, будто ждёт, что ты что-то вспомнишь.", "Biscuit trota hacia el este sin mirar atrás y se sienta al final de la calle, junto a una tabla suelta de la valla.": "Бисквит трусит на восток, не оглядываясь, и садится в конце улицы возле расшатанной доски забора.", "Bolsita vieja": "Старая сумочка", "Borrar monstruos": "Удалить монстров", "Bosteza. Quizá luego, cuando la noche sea más rara.": "Зевает. Может, потом, когда ночь станет ещё страннее.", "Bot Bromista": "Бот-Шутник", "Bot Curandero": "Бот-Лекарь", "Bot Guía": "Бот-Проводник", "Bot Tramposo": "Бот-Обманщик", "Bot Vendedor": "Бот-Продавец", "Burbujea la última nota de la canción: tu nombre.": "Шипит последней нотой песни: твоим именем.", "Bzzz... Reparación completada. +40 de vida.": "Бззз... Ремонт завершён. +40 к жизни.", "Cada año llamas y yo abro. Cada año. ¿No es gracioso? He perdido la cuenta.": "Каждый год ты звонишь, а я открываю. Каждый год. Разве не смешно? Я сбилась со счёта.", "Cada hilo lleva de vuelta a la primera casa.": "Каждая нить ведёт назад, к первому дому.", "Cada uno vive su propia historia, pero os veréis en la calle como zorros fantasma.": "У каждого своя история, но на улице вы увидите друг друга призрачными зверьками.", "Caes sobre la hierba del jardín. Todo el cuerpo te duele. Detrás de ti, la ventana se cierra sola. La noche sigue ahí. Y la luz del nº 13, lejos, al oeste, todavía te espera.": "Ты падаешь на траву в саду. Всё тело болит. Позади окно само закрывается. Ночь всё ещё здесь. А свет дома № 13, далеко на западе, всё ещё ждёт тебя.", "Calabaza Gigante": "Гигантская Тыква", "Calle Marrow": "Улица Марроу", "Caminas a casa. Todas las ventanas de la calle Marrow son cálidas y normales. Los caramelos son solo caramelos. Duermes con el disfraz puesto, y la luz del porche, por una vez, se apaga sola.": "Ты идёшь домой. Все окна на улице Марроу тёплые и обычные. Конфеты — просто конфеты. Ты засыпаешь в костюме, и свет на крыльце, впервые, гаснет сам.", "Caramelo de maíz clásico, ¡pero con sonrisa!": "Классическая кукурузная конфета, но с улыбкой!", "Caramelo otra vez. Te gusta. Siempre te gustó.": "Снова карамель. Тебе нравится. Тебе всегда нравилось.", "Caramelos: la Sra. Pim. La primera nota: el Sr. Bellows.": "Конфеты: миссис Пим. Первая нота: мистер Беллоуз.", "Casa Nº13": "Дом № 13", "Casa sin número": "Дом без номера", "Centro de la calle": "Середина улицы", "Cerrada con llave. La llave tiene que estar en esta sala. O puedes salir por la ventana.": "Заперто на ключ. Ключ должен быть в этой комнате. Или можно выйти через окно.", "Chapa de Biscuit": "Жетон Бисквита", "Chapa de Biscuit: «WREN, Calle Marrow 13». Ese es mi nombre.": "Жетон Бисквита: «РЕН, улица Марроу, 13». Это моё имя.", "Chapa del collar": "Жетон с ошейника", "Charlar con": "Поболтать с", "Coger la llave": "Взять ключ", "Comer (+vida)": "Съесть (+жизнь)", "Comparte este código con tus amigos:": "Поделись этим кодом с друзьями:", "Copiar código": "Скопировать код", "Corre al OESTE, al nº 13. Las farolas encendidas te protegen.": "Беги на ЗАПАД, к дому № 13. Горящие фонари защитят тебя.", "Crear sala": "Создать комнату", "Croac... parece que ya has hecho esto antes.": "Ква... кажется, ты уже делал это раньше.", "Créditos": "Титры", "Cuarto de Wren": "Комната Рен", "Cubo de Wren": "Ведёрко Рен", "Cálida, dorada, sabe a cocina de abuela.": "Тёплая, золотая, на вкус как бабушкина кухня.", "Cómetelo y quédate. Por favor.": "Съешь её и останься. Пожалуйста.", "Cómo jugar": "Как играть", "DIOS-M · G: mod menu": "DIOS-M · G: мод-меню", "Dar todas las llaves": "Выдать все ключи", "Decir tu nombre: «Wren»": "Назвать своё имя: «Рен»", "Dejarla en paz": "Оставить её в покое", "Dejo la luz del porche encendida por si alguien se pierde. ¡Vieja manía!": "Я оставляю свет на крыльце на случай, если кто-то заблудится. Старая привычка!", "Del desagüe sale un sonido: un niño tarareando, muy lento. Se detiene cuando dejas de respirar.": "Из ливневой канавы доносится звук: ребёнок напевает, очень медленно. Он стихает, когда ты перестаёшь дышать.", "Dentro hay una tartaleta diminuta. Sigue caliente. Nunca se horneó.": "Внутри крошечная тарталетка. Она всё ещё горячая. Её никогда не пекли.", "Devolver el saludo": "Помахать в ответ", "Devolver los caramelos": "Вернуть конфеты", "Dibujo: todos los vecinos lo vieron y nadie dijo nada.": "Рисунок: все соседи видели, и никто ничего не сказал.", "Dibujos en mi cuarto: todos con un desagüe en la esquina. En el último, yo dentro.": "Рисунки в моей комнате: у всех в углу сток. На последнем — я внутри.", "Diente de Maíz Dulce": "Зуб из кукурузной карамели", "Dulce y especiada. ¡El fantasma del envoltorio te guiña un ojo!": "Сладкая и пряная. Привидение на обёртке подмигивает тебе!", "E / ACT: tocar timbres, hablar, acariciar, buscar.": "E / ACT: звонить в дверь, говорить, гладить, искать.", "E / toca para continuar": "E / коснись, чтобы продолжить", "EL HALLOWEEN PERFECTO": "ИДЕАЛЬНЫЙ ХЭЛЛОУИН", "EL QUE RECUERDA": "ТОТ, КТО ПОМНИТ", "EL ÚLTIMO TIMBRE": "ПОСЛЕДНИЙ ЗВОНОК", "El Hombre del Farol solo quiere que alguien le abra y le diga que ya puede dejar de buscar.": "Человек-Фонарь хочет только, чтобы ему открыли и сказали, что можно перестать искать.", "El Sr. Bellows toca la tuba con los ojos cerrados, sin parar. Desde fuera, entre nota y nota, se oye una vocecita llamando. Aquella noche tocó tan fuerte que no oyó a nadie. Hoy toca más fuerte todavía, para no oírla.": "Мистер Беллоуз играет на тубе с закрытыми глазами, не останавливаясь. Снаружи, между нотами, слышится тоненький зовущий голос. В ту ночь он играл так громко, что никого не услышал. Сегодня играет ещё громче, чтобы не слышать.", "El Sr. Bellows tocó tan fuerte que no me oyó llamar. Sigue sin querer oírme.": "Мистер Беллоуз играл так громко, что не услышал, как я звал. Он по-прежнему не хочет меня слышать.", "El burbujeo suena como alguien tarareando la primera nota.": "Шипение звучит так, будто кто-то напевает первую ноту.", "El burbujeo tararea una nana que no sabías que conocías.": "Шипение напевает колыбельную, которую ты не знал, что знаешь.", "El cuenco": "Миска", "El cuenco está lleno de toffees. Todos de tu tamaño.": "Миска полна ирисок. Все твоего размера.", "El cuenco está tibio, como si alguien lo acabara de sostener.": "Миска тёплая, будто кто-то только что её держал.", "El desagüe de la calle Marrow se abre en mitad del asfalto, sin ruido, como una boca. De él sube tu nombre dicho por todos los vecinos a la vez. Cuando termina, en la casa sin número se enciende una luz.": "Сток улицы Марроу открывается посреди асфальта — без звука, как рот. Из него поднимается твоё имя, сказанное всеми соседями сразу. Когда оно стихает, в доме без номера загорается свет.", "El desagüe se abrió y pronunció mi nombre con todas las voces. En la casa sin número se encendió una luz.": "Сток открылся и произнёс моё имя всеми голосами. В доме без номера загорелся свет.", "El desagüe tarareó la melodía de la calle, y luego un nombre.": "Сток напел мелодию улицы, а потом — имя.", "El envoltorio dice: espérame.": "На обёртке написано: жди меня.", "El envoltorio solo dice NO, una y otra vez.": "На обёртке написано только НЕТ, снова и снова.", "El espantapájaros se mueve cuando no lo miro.": "Пугало двигается, когда я не смотрю.", "El fantasma del envoltorio se parece a la Sra. Pim.": "Привидение на обёртке похоже на миссис Пим.", "El fantasma del envoltorio ya no guiña.": "Привидение на обёртке больше не подмигивает.", "El mapa no coincide con la calle.": "Карта не совпадает с улицей.", "El nº 13½ existe en el mapa y no en la calle. Dentro estaba mi cuarto.": "Дом № 13½ есть на карте, но не на улице. Внутри была моя комната.", "El timbre suena desde dentro. No ha parado.": "Звонок звонит изнутри. Он не умолкает.", "Elige a otro jugador como objetivo.": "Выбери другого игрока целью.", "Elige tu disfraz": "Выбери костюм", "Empezar partida": "Начать игру", "En algún lugar a tu espalda suena un timbre una sola vez. No hay nadie cerca. La música se salta una nota y sigue como si nada.": "Где-то за спиной один раз звонит звонок. Рядом никого нет. Музыка пропускает ноту и продолжается как ни в чём не бывало.", "En el buzón hay algo para ti. No le digas que te lo dije yo.": "В почтовом ящике что-то для тебя. Не говори ей, что это я сказала.", "En la pared hay dibujos a cera de una niña: una calle con casas sonrientes. Cada dibujo tiene un desagüe en una esquina. En el último, una figura pequeña dentro del desagüe. Debajo, con letra infantil: «volveré antes de que se acabe el caramelo».": "На стене восковые рисунки девочки: улица с улыбающимися домами. На каждом рисунке в углу сток. На последнем — маленькая фигурка внутри стока. Ниже детским почерком: «я вернусь, пока не кончилась конфета».", "Encontré una llave:": "Я нашёл ключ:", "Entrar en la casa": "Войти в дом", "Entras. La puerta se cierra de golpe a tu espalda y el cerrojo gira solo. Dentro es oscuro y la casa es mucho más grande de lo que parecía. Tu linterna es la única luz. Algo pequeño se mueve entre los muebles. Mantén F para alzarla.": "Ты входишь. Дверь захлопывается за спиной, замок поворачивается сам. Внутри темно, а дом куда больше, чем казался. Твой фонарь — единственный свет. Что-то маленькое шевелится среди мебели. Удерживай F, чтобы поднять его.", "Entre el nº 7 y el nº 9 hay una casa que antes no estaba: el nº 13½. Tiene la puerta abierta y dentro se ve tu cuarto, tal como lo dejaste. Cuando te acercas, la calle se alarga y nunca llegas.": "Между домами № 7 и № 9 стоит дом, которого раньше не было: № 13½. Дверь открыта, а внутри видна твоя комната, такая, как ты её оставил. Когда ты подходишь, улица удлиняется, и ты не доходишь никогда.", "Enviar texto": "Отправить текст", "Eres el punto naranja. Las estrellas marcan casas visitadas.": "Ты — оранжевая точка. Звёзды отмечают посещённые дома.", "Es 31 de octubre. Siempre es 31 de octubre. La calle está tan feliz esta noche. ¿A que es el Halloween más feliz de todos?": "Сегодня 31 октября. Всегда 31 октября. Улица так счастлива этой ночью. Правда ведь, это самый счастливый Хэллоуин?", "Es de día. Todas las casas están vacías, tranquilas y terminadas, y un zorrito sale del último Halloween hacia el sol.": "Наступил день. Все дома пусты, тихи и закончены, а {d} выходит из последнего Хэллоуина навстречу солнцу.", "Es de tu tamaño. Siempre fue tuyo.": "Она твоего размера. Всегда была твоей.", "Es para mi pequeño. Para los niños, quiero decir. Todos los niños.": "Это для моего малыша. Для детей, я хотела сказать. Для всех детей.", "Es tuyo. No recuerdas haberlo perdido.": "Он твой. Ты не помнишь, как потерял его.", "Es un diente de leche. Obviamente es un caramelo.": "Это молочный зуб. Конечно, это конфета.", "Es un diente. Obviamente es un caramelo. Obviamente.": "Это зуб. Конечно, это конфета. Конечно.", "Esa sala no existe o ya se cerró.": "Такой комнаты нет, или она уже закрыта.", "Esa sala ya empezó. Solo DIOS-M puede entrar a salas iniciadas.": "Эта комната уже началась. Только DIOS-M может входить в начатые комнаты.", "Escribe el código de la sala.": "Введи код комнаты.", "Escribe el código que te envió tu amigo:": "Введи код, который прислал друг:", "Escribe tu nombre de usuario:": "Введи своё имя пользователя:", "Escribe un nombre de usuario.": "Введи имя пользователя.", "Escribe un texto primero.": "Сначала введи текст.", "Escrito por el Night Shift.": "Написано Ночной Сменой.", "Ese jugador no está disponible.": "Этот игрок недоступен.", "Espantapájaros": "Пугало", "Esperando a que el anfitrión empiece...": "Ждём, пока хозяин комнаты начнёт игру...", "Esta es tu casa. Lo supiste al ver el cuenco. Dentro, tu cuarto: la cama sin deshacer, el cubo de calabaza esperando junto a la puerta. Alguien limpia el polvo cada día aunque no vive nadie. En la cama, una nota: «Wren, ya puedes volver».": "Это твой дом. Ты понял это, увидев миску. Внутри твоя комната: неразобранная кровать, тыквенное ведёрко ждёт у двери. Кто-то каждый день вытирает пыль, хотя здесь никто не живёт. На кровати записка: «Рен, теперь можно вернуться».", "Esta noche las notas están en el orden equivocado. O yo.": "Сегодня ночью ноты стоят в неправильном порядке. Или я.", "Estrella Herida": "Раненая Звезда", "Estrella Mirona": "Звезда-Наблюдатель", "Estrella Ácida": "Кислая Звезда", "Está calentito. Sujétalo, no te lo comas. O cómetelo. Todos lo hacen.": "Она тёплая. Держи, не ешь. Или съешь. Все едят.", "Está susurrando algo. Todas las calabazas de la calle susurran lo mismo.": "Она что-то шепчет. Все тыквы на улице шепчут одно и то же.", "Estás seguro de que estaba junto a la primera casa. Su cabeza de linterna se ha girado hacia ti.": "Ты уверен, что он стоял у первого дома. Его фонарная голова повернулась к тебе.", "Estás tan cerca que ves su sonrisa tallada. No es de calabaza. Son dientes de leche, pequeños, uno por uno. Parpadeas, y estás lejos de él. Y él, más cerca de ti.": "Ты так близко, что видишь его вырезанную улыбку. Это не тыква. Это молочные зубы, маленькие, один за другим. Ты моргаешь — и ты далеко от него. А он — ближе к тебе.", "Extiendes los caramelos. Envoltorio a envoltorio se abren, y cada uno es el nombre de un vecino. El Hombre del Farol pregunta: ¿truco o trato? Respondes: trato. Porche a porche se apagan las luces y los vecinos se van a casa.": "Ты протягиваешь конфеты. Обёртка за обёрткой раскрываются, и на каждой имя соседа. Человек-Фонарь спрашивает: сладость или гадость? Ты отвечаешь: сладость. Крыльцо за крыльцом гаснут огни, и соседи расходятся по домам.", "Fantasma Llorón": "Плачущее Привидение", "Fantasma de Canela": "Привидение с корицей", "Final de la calle": "Конец улицы", "Foto desgastada": "Выцветшее фото", "Foto en el buzón de Juno: un niño disfrazado de zorro en el porche del nº 13. La cara, borrada por un pulgar.": "Фото в почтовом ящике Юно: ребёнок в костюме {n} на крыльце дома № 13. Лицо стёрто большим пальцем.", "Fotos de familia cubren la pared. A todos los niños les han rascado la cara menos a uno: un zorrito sonriente en brazos de una mujer que se parece mucho a la abuela Wick, más joven.": "Семейные фото покрывают стену. У всех детей лица выскоблены, кроме одного: улыбающийся {d} на руках у женщины, очень похожей на бабушку Уик, только моложе.", "Fotos en la casa vacía: la abuela Wick joven con un niño disfrazado de zorro.": "Фото в пустом доме: молодая бабушка Уик с ребёнком в костюме {n}.", "Gota de Rana": "Лягушачья Капля", "Gota de Rana. Escribí en el envoltorio. Léelo luego.": "Лягушачья Капля. Я написала на обёртке. Прочти потом.", "Gota de Rana. No. Lee el envoltorio.": "Лягушачья Капля. Нет. Читай обёртку.", "Gota de Rana. Siento tener que darte esto.": "Лягушачья Капля. Прости, что приходится тебе её давать.", "Gracias. Nadie me cree. Nadie recuerda que lo dije.": "Спасибо. Мне никто не верит. Никто не помнит, что я это говорила.", "Guardar y salir": "Сохранить и выйти", "HALLOWEEN PARA SIEMPRE": "ХЭЛЛОУИН НАВСЕГДА", "Hablar con": "Поговорить с", "Has visto todos los finales. Casi.": "Ты увидел все концовки. Почти.", "Has vuelto. Quiero decir... has PASADO. Qué zorrito tan puntual.": "Ты вернулся. То есть... ты ПРОШЁЛ мимо. Какой пунктуальный {d}.", "Hay algo atrapado en el regaliz: una palabra diminuta. Quédate.": "В лакрице что-то застряло: крошечное слово. Останься.", "He comido": "Я съел", "Hombre del Farol": "Человек-Фонарь", "Hoy ya no me quedan más. Bip.": "Сегодня больше не осталось. Бип.", "I: bolsa de caramelos. J: diario. M: mapa. Esc: menú.": "I: сумка с конфетами. J: дневник. M: карта. Esc: меню.", "Ignoré el desagüe que tarareaba. Tarareó más fuerte.": "Я не обратил внимания на напевающий сток. Он запел громче.", "Iniciar persecución": "Начать погоню", "Invocar monstruo": "Призвать монстра", "Ir a la sala nº": "Перейти в комнату №", "Ir al objetivo": "К цели", "Ja. Claro. Solo caramelo. (Sigue sonriendo cuando te das la vuelta.)": "Ха. Конечно. Просто конфета. (Она продолжает улыбаться, когда ты отворачиваешься.)", "Jardín secreto": "Тайный сад", "Jugador(es) traído(s).": "Игрок(и) доставлен(ы).", "Jugadores (": "Игроки (", "Jugar de nuevo": "Играть снова", "Jumpscare enviado.": "Скример отправлен.", "Juno está pegada al cristal, con una manta sobre los hombros. Tenía fiebre y por eso no salió contigo. Te vio alejarte hacia el desagüe y no gritó. Sigue en la ventana. Tiene tu edad y siempre la tendrá.": "Юно прижалась к стеклу, на плечах одеяло. У неё была температура, поэтому она не пошла с тобой. Она видела, как ты уходил к стоку, и не крикнула. Она всё ещё в окне. Ей столько же лет, сколько тебе, и так будет всегда.", "Juno me rogó que no comiera los caramelos. Le creo.": "Юно умоляла меня не есть конфеты. Я ей верю.", "Juno me vio ir al desagüe y no gritó. Sigue en la ventana.": "Юно видела, как я шёл к стоку, и не крикнула. Она всё ещё в окне.", "Juno te agarra de la manga. «No te comas los caramelos. Cada uno es alguien. ¿Vale? ¿Vale?»": "Юно хватает тебя за рукав. «Не ешь конфеты. Каждая из них — кто-то. Хорошо? Хорошо?»", "La Sra. Pim me mandó por el atajo del desagüe. Aún hornea por culpa.": "Миссис Пим отправила меня коротким путём через сток. Она до сих пор печёт из-за вины.", "La Sra. Pim saca bandejas del horno. Todas vacías. Las coloca en fila: una para cada niño de la calle. Aquella noche te dio una tartaleta y te dijo que volvieras por el atajo de detrás, el del desagüe, que era más rápido. Lo recuerda cada segundo. Por eso no deja de hornear.": "Миссис Пим достаёт противни из духовки. Все пустые. Она расставляет их рядами: по одному на каждого ребёнка улицы. В ту ночь она дала тебе тарталетку и сказала идти домой коротким путём, через сток, так быстрее. Она помнит это каждую секунду. Поэтому не перестаёт печь.", "La abuela Wick lleva cuarenta años cosiendo mi disfraz.": "Бабушка Уик уже сорок лет шьёт мой костюм.", "La acaricias. Hace un momento miraba a la calle. Ahora te mira a ti.": "Ты гладишь её. Секунду назад она смотрела на улицу. Теперь смотрит на тебя.", "La bombilla parpadea con un ritmo lento: corto, largo, largo... Lo cuentas. Se repite.": "Лампа мигает в медленном ритме: коротко, долго, долго... Ты считаешь. Это повторяется.", "La calle Marrow brilla con cien calabazas encendidas. Muévete con WASD o las flechas y pulsa E ante una puerta para llamar al timbre. Recoge caramelos, sé educado, ¡y diviértete!": "Улица Марроу сияет сотней зажжённых тыкв. Двигайся с помощью WASD или стрелок и нажимай E у двери, чтобы позвонить. Собирай конфеты, будь вежлив и веселись!", "La casa sin número es mi casa. En mi cama: «Wren, ya puedes volver».": "Дом без номера — мой дом. На моей кровати: «Рен, теперь можно вернуться».", "La letra de Juno: «no me comas».": "Почерк Юно: «не ешь меня».", "La linterna está tibia entre tus manos. Alguien tiene que mantenerla encendida. Alguien tiene que brillar para quien aún esté perdido.": "Фонарь тёплый в твоих руках. Кто-то должен поддерживать огонь. Кто-то должен светить тому, кто всё ещё потерян.", "La llave del nº 13 está en el fondo de la casa sin número. Y recuerda: siempre hay una ventana.": "Ключ от дома № 13 — в глубине дома без номера. И помни: окно есть всегда.", "La llave gira. Detrás hay otra sala. Y otra detrás. La casa no se acaba.": "Ключ поворачивается. За дверью ещё одна комната. И ещё одна за ней. Дом не кончается.", "La llave gira. La puerta se abre despacio hacia": "Ключ поворачивается. Дверь медленно открывается в", "La luz no se apaga, corazón. Lo he intentado. Entra. Hace tanto frío ahí fuera.": "Свет не гаснет, милый. Я пыталась. Заходи. На улице так холодно.", "La melodía del Sr. Bellows es el tema de la calle. Es una nana.": "Мелодия мистера Беллоуза — тема этой улицы. Это колыбельная.", "La melodía es de esta calle. Alguien la escribió para un niño. El hijo de alguien. ¿De quién?": "Эта мелодия — с этой улицы. Кто-то написал её для ребёнка. Для чьего-то ребёнка. Для чьего?", "La música se detiene. No baja: se detiene. En el silencio, cada casa de la calle Marrow se inclina un poco hacia ti, como si quisiera oírte mejor.": "Музыка останавливается. Не затихает — останавливается. В тишине каждый дом на улице Марроу чуть наклоняется к тебе, будто хочет лучше тебя слышать.", "La música se saltó una nota. Un timbre sonó solo.": "Музыка пропустила ноту. Звонок прозвенел сам.", "La noche que nunca termina": "Ночь, которая никогда не кончается", "La nota ha cambiado: «¡Salimos a buscar! Coge uno. Espérame».": "Записка изменилась: «Мы ушли искать! Возьми одну. Жди меня».", "La puerta de la casa sin número se cerró sola detrás de mí.": "Дверь дома без номера сама закрылась за мной.", "La puerta del nº 13 está cerrada con llave. La llave está en la casa sin número, al este.": "Дверь дома № 13 заперта на ключ. Ключ в доме без номера, на востоке.", "La puerta está entreabierta. El timbre brilla con un nombre: WREN.": "Дверь приоткрыта. Звонок светится именем: WREN.", "La puerta principal se bloqueó al entrar. Tiene que haber otra salida.": "Входная дверь заблокировалась, когда я вошёл. Должен быть другой выход.", "La puerta principal se cerró de golpe a tu espalda. Tiras del pomo, empujas, golpeas. No cede. Desde fuera, muy lejos, suena un timbre. Pero en la pared del fondo hay una ventana...": "Входная дверь захлопнулась за твоей спиной. Ты дёргаешь ручку, толкаешь, стучишь. Не поддаётся. Снаружи, очень далеко, звонит звонок. Но в дальней стене есть окно...", "La puerta se abre antes de que la toques. La abuela Wick está en la luz. Tras ella, el pasillo es la calle. Tras la calle, es el pasillo.": "Дверь открывается, прежде чем ты её касаешься. Бабушка Уик стоит в свете. За ней коридор — это улица. За улицей — коридор.", "La sala está llena (máximo 4).": "Комната заполнена (максимум 4).", "La sala se cerró.": "Комната закрылась.", "La sonrisa es más ancha de lo que recuerdas. La llama de la vela no se mueve, ni con el viento.": "Улыбка шире, чем ты помнишь. Пламя свечи не колышется, даже на ветру.", "La tabla se aparta. Tras la valla hay un jardincito que no sale en ningún mapa. Está muy silencioso. Hasta la música suena más baja.": "Доска отодвигается. За забором небольшой садик, которого нет ни на одной карте. Здесь очень тихо. Даже музыка звучит тише.", "La única salida de la casa es la ventana. Siempre lo fue.": "Единственный выход из дома — окно. Так было всегда.", "Las calabazas se giran para mirarme.": "Тыквы поворачиваются, чтобы смотреть на меня.", "Las sonrisas de las calabazas se quedan fijas. Las ventanas se apagan una a una. Por primera vez en toda la noche ves a los vecinos sin sonreír. Quizá sea la primera vez que los ves de verdad.": "Улыбки тыкв застывают. Окна гаснут одно за другим. Впервые за всю ночь ты видишь соседей не улыбающимися. Может быть, впервые ты видишь их по-настоящему.", "Leer la chapa del collar": "Прочитать жетон на ошейнике", "Leer la nota": "Прочитать записку", "Levanta la tuba y toca. Es la melodía que te ha seguido toda la noche, más lenta, y la última nota nunca llega.": "Он поднимает тубу и играет. Это та мелодия, что преследовала тебя всю ночь, медленнее, и последняя нота так и не звучит.", "Llamar al timbre otra vez": "Позвонить в дверь ещё раз", "Llave de latón": "Латунный ключ", "Llave dentada": "Зубчатый ключ", "Llave larga": "Длинный ключ", "Llave nº 13": "Ключ № 13", "Llenar cubo": "Наполнить ведёрко", "Llevo años tocando la misma nana. ¡Toda la calle Marrow la tararea!": "Я годами играю одну и ту же колыбельную. Вся улица Марроу подпевает!", "Llévate dos, cielo. La tuba toca sola por las noches. Escucha.": "Возьми две, милый. Туба играет сама по ночам. Послушай.", "Llévate dos, cielo. Pum-pa... la canción es para un pequeño que nunca... pum. Pa.": "Возьми две, милый. Пум-па... эта песня для малыша, который никогда не... пум. Па.", "Llévate dos, cielo. Pum-pa... mm. Solo recuerdo la primera nota, ¿sabes?": "Возьми две, милый. Пум-па... мм. Помню только первую ноту, понимаешь?", "Llévate dos, cielo. Recién salidas del horno. El horno no está caliente desde hace... ¿quién se come mis tartaletas?": "Возьми две, милый. Прямо из духовки. Духовка не горячая уже... кто съедает мои тарталетки?", "Llévate dos, cielo. Tartaletas de calabaza recién salidas del horno. ¿Ya te lo dije? Siempre lo digo.": "Возьми две, милый. Тыквенные тарталетки прямо из духовки. Я уже говорила? Я всегда так говорю.", "Llévate dos, cielo. Te estoy metiendo en la receta. En la... la receta. Perdona.": "Возьми две, милый. Я добавляю тебя в рецепт. В... рецепт. Прости.", "Los caramelos nunca fueron la trampa. Lo fue el desearlos. Llamas a un timbre, y alguien se alegra muchísimo de ver a un zorrito tan pequeño.": "Конфеты никогда не были ловушкой. Ловушкой было желание их. Ты звонишь в дверь, и кто-то безумно рад видеть такого маленького {d}.", "Luna de Caramelo": "Карамельная Луна", "Luz del porche: la abuela Wick, que sigue esperando.": "Свет на крыльце: бабушка Уик, которая всё ещё ждёт.", "MOD MENU · DIOS-M": "МОД-МЕНЮ · DIOS-M", "Mamá no contesta. Está en la ventana. Lleva toda la noche en la ventana.": "Мама не отвечает. Она в окне. Она всю ночь стоит в окне.", "Mantenlo callado en tu bolsa.": "Держи её тихо в своей сумке.", "Mantén F / LAMP: levanta tu linterna.": "Удерживай F / LAMP: поднять фонарь.", "Me mudé hace treinta años. ¡La mejor calle del pueblo, con la mejor gente!": "Я переехала сюда тридцать лет назад. Лучшая улица в городе, с лучшими людьми!", "Me reí de Juno. Su sonrisa duró demasiado.": "Я посмеялся над Юно. Её улыбка продержалась слишком долго.", "Me saludé a mí mismo. Él saludó primero.": "Я помахал самому себе. Он помахал первым.", "Menú principal": "Главное меню", "Miedo +2": "Страх +2", "Miedo −2": "Страх −2", "Mirar a otro lado": "Отвернуться", "Mirar al espantapájaros": "Посмотреть на пугало", "Mirar la farola": "Посмотреть на фонарь", "Mirar las fotos": "Посмотреть фото", "Mirar los dibujos": "Посмотреть рисунки", "Mirar por la ventana": "Заглянуть в окно", "Miras hacia la primera farola. Un pequeño zorro está debajo. Mismo disfraz. Mismo cubo. Te saluda con la mano.": "Ты смотришь на первый фонарь. Под ним стоит маленький {n}. Тот же костюм. То же ведёрко. Он машет тебе рукой.", "Mis pasos llegan un segundo tarde. Los vecinos dejaron de moverse.": "Мои шаги приходят на секунду позже. Соседи перестали двигаться.", "Modo DIOS-M": "Режим DIOS-M", "Monstruo invocado:": "Монстр призван:", "Morse de la farola: .-- .-. . -.  (¿W R E N?)": "Морзе с фонаря: .-- .-. . -.  (Р Е Н?)", "Morí... y desperté en el mismo sitio.": "Я умер... и очнулся на том же месте.", "Moverte: WASD / flechas (o la cruceta táctil).": "Двигаться: WASD / стрелки (или сенсорный крестик).", "Murciélago Burbujeante": "Шипучая Летучая Мышь", "Murciélago Burbujeante. Nunca dejan de aletear.": "Шипучая Летучая Мышь. Они никогда не перестают махать крыльями.", "Más allá del cuarto de Wren la casa sigue. Hay salas sin fin, y todas tienen ventana.": "За комнатой Рен дом продолжается. Комнаты бесконечны, и в каждой есть окно.", "Nada raro todavía. Solo una noche preciosa.": "Пока ничего странного. Просто чудесная ночь.", "Necesitas la llave: casa sin número, al ESTE. Luego al nº 13.": "Нужен ключ: дом без номера, на ВОСТОКЕ. Потом к дому № 13.", "No es un espantapájaros.": "Это не пугало.", "No estás en el mapa.": "Тебя нет на карте.", "No hay nadie en casa. Un cuenco en el escalón y una nota: «¡Salimos a pedir caramelos! Coge UNO».": "Никого нет дома. Миска на ступеньке и записка: «Ушли за конфетами! Возьми ОДНУ».", "No hay salas activas ahora mismo.": "Сейчас нет активных комнат.", "No te toca. Solo te mira, y el mundo se queda en silencio. Luego estás de pie en mitad de la calle otra vez, y tu cubo pesa menos.": "Он не касается тебя. Он только смотрит, и мир затихает. Потом ты снова стоишь посреди улицы, и твоё ведёрко стало легче.", "Nota de la abuela: la ventana siempre estuvo abierta.": "Записка бабушки: окно всегда было открыто.", "Nueva partida": "Новая игра", "Nunca estuviste visitando la calle Marrow. La calle Marrow te visitaba a ti, cada año, esperando a que llamaras al timbre de la casa donde empezaste. «Estás en casa», dice la abuela Wick, por cuadragésima vez.": "Ты никогда не навещал улицу Марроу. Это улица Марроу навещала тебя, каждый год, ожидая, что ты позвонишь в дверь дома, где всё началось. «Ты дома», — говорит бабушка Уик в сороковой раз.", "Oh... ¿ya de vuelta, cielo? ...Quiero decir, ¡bienvenido! ¡Bienvenido!": "О... ты уже вернулся, милый? ...То есть, добро пожаловать! Добро пожаловать!", "Otro fantasma. Cada año se parecen más a alguien.": "Ещё одно привидение. Каждый год они всё больше на кого-то похожи.", "Pasillo en L": "Коридор-Г", "Payaso de Caramelo": "Конфетный Клоун", "Pedirle que toque la canción": "Попросить сыграть песню", "Pegajosa y verde. En el envoltorio, la letra de Juno: «no».": "Липкая и зелёная. На обёртке почерк Юно: «нет».", "Pegajosa, verde, y salta en la boca (probablemente).": "Липкая, зелёная и прыгает во рту (наверное).", "Por favor, no seas amable conmigo. Por favor, no seas amable con nadie. Escucha cuando eres amable.": "Пожалуйста, не будь добр ко мне. Пожалуйста, не будь добр ни к кому. Оно слушает, когда ты добр.", "Por la mañana hay una linterna en la ventana de tu cuarto. Estás seguro de que no te la trajiste a casa.": "Утром в окне твоей комнаты стоит фонарь. Ты уверен, что не приносил его домой.", "Por la ventana se ve la calle Marrow y, muy lejos, la luz del porche del nº 13. El suelo está abajo, muy abajo. Las puertas solo llevan más adentro. Esta es la única salida, pero la caída duele. Si tu vida es baja, no sobrevivirás.": "Из окна видна улица Марроу и, очень далеко, свет на крыльце дома № 13. Земля внизу, очень далеко внизу. Двери ведут только вглубь. Это единственный выход, но падение причиняет боль. Если у тебя мало жизни, ты не выживешь.", "Por la ventana ves a la abuela Wick en el salón, de espaldas, cosiendo. Cose un disfraz de zorro de tu talla. Lleva cuarenta años cosiéndolo y el hilo no se acaba. Sobre la mesa hay una taza de té sin tocar, con tu nombre escrito en el borde.": "В окне ты видишь бабушку Уик в гостиной, спиной к тебе, она шьёт. Она шьёт костюм {n} твоего размера. Она шьёт его сорок лет, и нитка не кончается. На столе нетронутая чашка чая с твоим именем на ободке.", "Puedes entrar a cualquier sala sin código.": "Ты можешь войти в любую комнату без кода.", "Puerta": "Дверь", "Puerta principal": "Входная дверь", "Pulsas el timbre por segunda vez. Tras la puerta hay diez mil puertas, cada una abierta al mismo porche, al mismo zorrito. El timbre toca la nana hasta su última nota.": "Ты звонишь во второй раз. За дверью десять тысяч дверей, каждая открывается на то же крыльцо, к тому же {d}. Звонок играет колыбельную до последней ноты.", "Quedarte esperando con ella": "Остаться ждать вместе с ней", "Quedarte un momento": "Постоять немного", "Quédate Estrella": "Останься, Звезда", "Recargar batería": "Зарядить батарею", "Recoger caramelo": "Подобрать конфету", "Recoger la bolsa vieja": "Подобрать старую сумочку", "Recortes de periódico pegados: «Niña desaparecida en Halloween. La policía revisa el desagüe de la calle Marrow. Sin hallazgos». La fecha está tachada una y otra vez.": "Вырезки из газет: «Пропала девочка в ночь на Хэллоуин. Полиция осматривает сток улицы Марроу. Ничего не найдено». Дата зачёркнута снова и снова.", "Recortes: niña desaparecida en Halloween, la policía revisó el desagüe.": "Вырезки: пропала девочка на Хэллоуин, полиция осматривала сток.", "Regaliz negro masticable. ¡Terrorífico y divertido!": "Жевательная чёрная лакрица. Страшно и весело!", "Revisar el buzón": "Проверить почтовый ящик", "Sabe a cocina de abuela. Nunca has conocido a una abuela así, ¿verdad?": "На вкус как бабушкина кухня. Ты никогда не знал такой бабушки, правда?", "Sabe a espera.": "На вкус как ожидание.", "Sabe a que la luna te mira.": "На вкус как взгляд луны.", "Sabe a una cocina que dejaste en Halloween.": "На вкус как кухня, которую ты оставил на Хэллоуин.", "Sabe a una estrella más cercana de lo que debería.": "На вкус как звезда, которая ближе, чем должна быть.", "Sabe al cielo nocturno que recuerdas desde la ventana.": "На вкус как ночное небо, которое ты помнишь из окна.", "Sala": "Комната", "Salir de la sala": "Выйти из комнаты", "Salté por la ventana sin fuerzas. No sobreviví a la caída.": "Я прыгнул в окно без сил. Я не пережил падение.", "Salón": "Гостиная", "Seguir a Biscuit": "Идти за Бисквитом", "Seguir el sonido": "Идти на звук", "Si tarareas la última nota, sabrá que estás aquí. No lo hagas.": "Если напеть последнюю ноту, оно узнает, что ты здесь. Не делай этого.", "Sigo diciendo lo mismo. Hola. Croac. Sigo diciendo hola y nadie se va.": "Я всё повторяю одно и то же. Привет. Ква. Я говорю привет, и никто не уходит.", "Sonríe un poco demasiado pronto. Luego desaparece y la farola parpadea.": "Он улыбается чуть слишком рано. Потом исчезает, и фонарь мигает.", "Sr. Bellows": "Мистер Беллоуз", "Sra. Pim": "Миссис Пим", "Su linterna huele a cera de cumpleaños. Susurra sin mover la boca: «ven a casa». Cuando abres los ojos, estás a veinte pasos de allí.": "Его фонарь пахнет праздничным воском. Он шепчет, не двигая ртом: «иди домой». Когда ты открываешь глаза, ты в двадцати шагах оттуда.", "Suena el último timbre de la calle Marrow. A tu espalda. Todas las casas suenan una tras otra, como una frase leída en voz alta.": "Звенит последний звонок на улице Марроу. За твоей спиной. Все дома звонят один за другим, как фраза, прочитанная вслух.", "Sus brazos son más largos. La linterna ya no parpadea. Simplemente arde, paciente.": "Его руки длиннее. Фонарь больше не мерцает. Он просто горит, терпеливо.", "TE HA MATADO:": "ТЕБЯ УБИЛ:", "TE HAS ESTRELLADO": "ТЫ РАЗБИЛСЯ", "TRUCO O TRATO": "СЛАДОСТЬ ИЛИ ГАДОСТЬ", "Tabla suelta": "Расшатанная доска", "Te alejas. El tarareo te sigue exactamente a tu paso durante diez pasos, y luego para.": "Ты уходишь. Напев следует за тобой шаг в шаг десять шагов, а потом затихает.", "Te comes:": "Ты съедаешь:", "Te miras los zapatos. El saludo no se detiene. Lo notas como un calor en la nuca.": "Ты смотришь на ботинки. Махание не прекращается. Ты чувствуешь его как тепло на затылке.", "Telaraña de Regaliz": "Паутина из Лакрицы", "Texto enviado.": "Текст отправлен.", "Tirarte por la ventana (caída: -": "Выпрыгнуть из окна (падение: -", "Toca los timbres de la calle Marrow.": "Звони в двери на улице Марроу.", "Toca todos los timbres de la calle. Pero no te fíes de todo lo que sonríe.": "Позвони во все двери на улице. Но не верь всему, что улыбается.", "Tocar el timbre": "Позвонить в дверь", "Todas las luces de los porches parpadean a la vez. Los vecinos se detienen en sus ventanas, quietos, mirándote. A tu espalda oyes pasos: son los tuyos, pero llegan un segundo tarde.": "Все огни на крыльцах мигают одновременно. Соседи замирают в окнах и смотрят на тебя. За спиной слышатся шаги: твои, но на секунду позже.", "Todas las luces de los porches se apagan a la vez. Calle abajo se enciende una única linterna. Camina. Tienes que llegar al nº 13, muy al OESTE, pero su puerta tiene la llave echada. Bajo una farola encendida estás a salvo. Mantén F para alzar tu linterna: no puede moverse mientras lo miras.": "Все огни на крыльцах гаснут одновременно. Вдалеке вниз по улице зажигается один фонарь. Он идёт. Тебе нужно добраться до дома № 13 далеко на ЗАПАДЕ, но его дверь заперта. Под горящим фонарём ты в безопасности. Удерживай F, чтобы поднять фонарь: пока ты смотришь, он не может двигаться.", "Todas las páginas del calendario dicen treinta y uno. He arrancado cientos.": "На всех страницах календаря написано тридцать первое. Я оторвала сотни.", "Todo el arte, música y sonido se genera en vivo en este archivo.": "Вся графика, музыка и звук создаются на лету в этом файле.", "Todos somos ecos de la misma noche, ¿vale? Tú eres el único que sigue volviendo.": "Мы все — эхо одной и той же ночи, ладно? Ты единственный, кто всё время возвращается.", "Todos tenemos una página, cielo. La tuya es la que se atascó en la puerta.": "У каждого из нас есть своя страница, милый. Твоя — та, что застряла в двери.", "Toffee Liso": "Гладкая Ириска", "Toffee liso. A alguien le encantaban las cosas sencillas.": "Гладкая ириска. Кому-то нравились простые вещи.", "Toma. Agárralo fuerte. Es todo lo que pude guardar.": "Держи. Держи крепче. Это всё, что я смогла сохранить.", "Traer al objetivo": "Привести цель", "Transformarme en BOT": "Превратиться в БОТА", "Treinta y un octubres. Treinta y uno, treinta y uno. Nunca llega a noviembre, cielo.": "Тридцать один октябрь. Тридцать один, тридцать один. Никогда не наступает ноябрь, милый.", "Truco o Trato: La noche que nunca termina": "Сладость или гадость: Ночь, которая никогда не кончается", "Tu bolsa guarda 8 caramelos. Comer te cambia a ti y a la calle. No todas las casas son lo que parecen. Sé curioso. Algunas decisiones no se pueden deshacer. La noche lo recuerda.": "В твоей сумке помещается 8 конфет. Еда меняет тебя и улицу. Не все дома такие, какими кажутся. Будь любопытен. Некоторые решения нельзя отменить. Ночь помнит.", "Tu cubo está lleno. Bip.": "Твоё ведёрко полно. Бип.", "Tómalo. Tararea, ¿verdad? Tararea para ti.": "Держи. Напевает, да? Напевает для тебя.", "Un buzón con forma de rana hambrienta. ¡Solo hay folletos dentro!": "Почтовый ящик в виде голодной лягушки. Внутри только рекламки!", "Un caramelo de oferta, solo para ti. Bip bop.": "Конфета по акции, только для тебя. Бип боп.", "Un dibujo a cera: la calle, las casas y, tras cada ventana, una figura que aprieta los puños. Debajo: «Todos lo vimos. Nadie dijo nada».": "Восковой рисунок: улица, дома и за каждым окном фигура, сжимающая кулаки. Внизу: «Мы все видели. Никто ничего не сказал».", "Un lugar tranquilo que no está en el mapa.": "Тихое место, которого нет на карте.", "Un solo toffee liso en el cuenco.": "Одна гладкая ириска в миске.", "Un toffee. Debajo, el cuenco está lleno de polvo.": "Одна ириска. Под ней миска полна пыли.", "Una bolsita desteñida con una oreja de zorro bordada. Dentro: polvo y una etiqueta de papel. SI LA ENCUENTRAS, DEVUÉLVELA A CALLE MARROW 13.": "Выцветшая сумочка с вышитым ухом {n}. Внутри: пыль и бумажная бирка. ЕСЛИ НАЙДЁТЕ, ВЕРНИТЕ НА УЛИЦУ МАРРОУ, 13.", "Una bolsita vieja con una oreja de zorro bordada, en el jardín secreto.": "Старая сумочка с вышитым ухом {n} в тайном саду.", "Una cinta con mi voz tarareando la nana y un susurro: «ya voy, abuela».": "Кассета с моим голосом, напевающим колыбельную, и шёпот: «иду, бабушка».", "Una cinta de casete con tu voz de niña tarareando la nana. Al final, una pausa y un susurro: «ya voy, abuela».": "Магнитофонная кассета с твоим детским голосом, напевающим колыбельную. В конце пауза и шёпот: «иду, бабушка».", "Una farola acogedora, zumbando de polillas.": "Уютный фонарь, гудящий от мотыльков.", "Una fotografía: un niño disfrazado de zorro en el porche del nº 13, sonriendo. La cara ha sido borrada por un pulgar. Detrás: HALLOWEEN y un año que cambia mientras lo lees.": "Фотография: ребёнок в костюме {n} на крыльце дома № 13, улыбается. Лицо стёрто большим пальцем. На обороте: ХЭЛЛОУИН и год, который меняется, пока ты читаешь.", "Una llave de latón con la etiqueta «13», de la casa vacía.": "Латунный ключ с биркой «13», из пустого дома.", "Una llave de latón sobre un lecho de envoltorios de toffee. La etiqueta dice 13. Está tibia.": "Латунный ключ на ложе из обёрток от ирисок. На бирке 13. Он тёплый.", "Una llave dentada, escondida en un cubo de calabaza olvidado en el suelo.": "Зубчатый ключ, спрятанный в забытом тыквенном ведёрке на полу.", "Una llave fría, escondida donde nadie la buscaría.": "Холодный ключ, спрятанный там, где никто не стал бы искать.", "Una llave larga y fría, dentro de un tarro de caramelos vacío, sobre el piano.": "Длинный холодный ключ в пустой банке из-под конфет на пианино.", "Una llave pequeña de latón, colgada de un clavo bajo un retrato familiar.": "Маленький латунный ключик, висящий на гвозде под семейным портретом.", "Una nota en la pared, con letra de abuela: «Wren, si lees esto, la ventana siempre estuvo abierta. La dejaba abierta para que volvieras por ella».": "Записка на стене бабушкиным почерком: «Рен, если ты это читаешь, окно всегда было открыто. Я оставляла его открытым, чтобы ты вернулся через него».", "Una página de diario: «Hoy el Hombre del Farol llegó hasta mi puerta. No quiere hacer daño. Quiere que alguien le abra por fin y le diga que ya puede dejar de buscar».": "Страница дневника: «Сегодня Человек-Фонарь дошёл до моей двери. Он не хочет причинить вред. Он хочет, чтобы ему наконец открыли и сказали, что можно перестать искать».", "Una silueta estaba en la ventana del nº 21. Desapareció cuando me acerqué.": "В окне дома № 21 стоял силуэт. Он исчез, когда я подошёл.", "Una última nota sin firmar: «Si has llegado tan hondo, es que no quieres irte. Las salas no se acaban. La ventana, sí. Elige».": "Последняя записка без подписи: «Если ты зашёл так глубоко, ты не хочешь уходить. Комнаты не кончаются. Окно — кончается. Выбирай».", "Unirme a una sala": "Войти в комнату", "VIDA": "ЖИЗНЬ", "Vacío. ¡Toca algunos timbres!": "Пусто. Позвони в несколько дверей!", "Velocidad x2:": "Скорость x2:", "Ventana": "Окно", "Vida": "Жизнь", "Vida infinita:": "Бессмертие:", "Volver a casa": "Вернуться домой", "Volver atrás": "Вернуться назад", "Vuelves a ser tú.": "Ты снова становишься собой.", "WREN. CALLE MARROW 13. SI LA ENCUENTRAS, DEVUÉLVELA A CASA. La chapa está pulida por el pulgar de alguien durante años.": "РЕН. УЛИЦА МАРРОУ, 13. ЕСЛИ НАЙДЁТЕ, ВЕРНИТЕ ДОМОЙ. Жетон отполирован чьим-то большим пальцем за долгие годы.", "Ya has hecho esto antes. La telaraña conoce tu ruta.": "Ты уже делал это раньше. Паутина знает твой путь.", "Ya hay un jugador con ese nombre en la sala.": "В комнате уже есть игрок с таким именем.", "Ya he hecho esto antes. Creo.": "Я уже делал это раньше. Кажется.", "Ya no es Halloween. Las ventanas de las casas guardan la verdad: hay que asomarse.": "Это больше не Хэллоуин. Окна домов хранят правду: нужно заглянуть в них.", "Ya no finge ser un espantapájaros. Te mira con la cabeza ladeada, como una madre esperando que termines de explicar por qué llegas tarde. Das un paso atrás sin querer. Todos tus pasos son hacia atrás.": "Он больше не притворяется пугалом. Он смотрит на тебя, склонив голову, как мать, ждущая, пока ты объяснишь, почему опоздал. Ты невольно делаешь шаг назад. Все твои шаги — назад.", "buhíto": "совёнок", "búho": "сова", "caramelos. No estoy lleno. Me siento recordado.": "конфет. Я не наелся. Я чувствую, что меня помнят.", "cuántos caramelos te quedan": "сколько конфет у тебя осталось", "de 5 encontrado.": "из 5 найдено.", "de vida)": "жизни)", "jugador(es)": "игрок(ов)", "la linterna se apagó para siempre": "фонарь погас навсегда", "la linterna se está apagando...": "фонарь гаснет...", "la luz sigue encendida": "свет всё ещё горит", "murciélago": "летучая мышь", "no mires atrás": "не оглядывайся", "no te comas el último": "не ешь последнюю", "te vi esa noche": "я видел тебя в ту ночь", "ya casi estás en casa": "ты почти дома", "¡Ay, qué zorrito tan precioso! Pasa, pasa. La luz del porche siempre está encendida para ti, cariño.": "Ах, какой чудесный {d}! Проходи, проходи. Свет на крыльце всегда горит для тебя, милый.", "¡Biscuit ronronea como una lancha diminuta! Una chapita brilla entre su pelo. Mirarás luego.": "Бисквит мурлычет, как крошечная моторка! В её шерсти поблёскивает жетончик. Посмотришь потом.", "¡Burbujea en la lengua como pequeños aplausos!": "Шипит на языке, как крошечные аплодисменты!", "¡CORRE al OESTE, al nº 13! Bajo una farola encendida estás a salvo.": "БЕГИ на ЗАПАД, к дому № 13! Под горящим фонарём ты в безопасности.", "¡Croac! ¡Soy una RANA! ¿Quieres ver cómo salto? ¿Quieres? ¿¿Quieres??": "Ква! Я ЛЯГУШКА! Хочешь посмотреть, как я прыгаю? Хочешь? Хочешь??", "¡Feliz Halloween!": "С Хэллоуином!", "¡Hola! ¡Croac! ¡Has vuelto! Estuviste aquí hace un segundo. ¿A que sí?": "Привет! Ква! Ты вернулся! Ты был здесь секунду назад. Правда же?", "¡Jo, jo! ¡Un zorrito! ¡Permíteme una serenata! ¡Pum-pa-pa, pum-pa-pa!": "Хо-хо! {d}! Позволь мне исполнить серенаду! Бум-па-па, бум-па-па!", "¡Mi mamá dice que los caramelos son un lenguaje de amor! El mío son los gusanitos de goma.": "Мама говорит, что конфеты — это язык любви! Мой — мармеладные червячки.", "¡Mira qué cosa tengo aquí!": "Смотри, что у меня тут есть!", "¡Se ríe! Una velita parpadea en su sonrisa. ¡Ji, ji!": "Она смеётся! Свечка мерцает в её улыбке. Хи-хи!", "¡Tartaletas de calabaza recién salidas del horno! ¿Travesuras? Bah. Eres demasiado dulce para eso.": "Тыквенные тарталетки прямо из духовки! Шалости? Ба. Ты слишком мил для этого.", "¡Toma un abrazo gratis! Bzzz...": "Держи бесплатное объятие! Бззз...", "¡Truco o trato!": "Сладость или гадость!", "¡Tu bolsa está llena! Pulsa I para comer o tirar algo.": "Твоя сумка полна! Нажми I, чтобы съесть или выбросить что-нибудь.", "¡Tu bolsa está llena! Pulsa I y come o tira algo.": "Твоя сумка полна! Нажми I и съешь или выбрось что-нибудь.", "¡Un Fantasma de Canela! No le digas a los demás que es mi favorito.": "Привидение с корицей! Не говори остальным, что это моё любимое.", "¡Un Murciélago Burbujeante! ¡Chillonamente bueno!": "Шипучая Летучая Мышь! Визгливо вкусная!", "¡Una Gota de Rana! ¡La mejor! ¡Como un abrazo con burbujas!": "Лягушачья Капля! Лучшая! Как объятие с пузырьками!", "¡Una Luna de Caramelo, todavía calentita!": "Карамельная Луна, ещё тёплая!", "¡Ya tienes uno, tontín! ¡Uno por cabeza!": "У тебя уже есть одна, глупыш! По одной на каждого!", "¡Ácida! ¡Brillante como un alfilerazo!": "Кислая! Яркая, как укол булавки!", "«Ay, Wren. Wren, llegas tarde. La luz del porche lleva cuarenta años encendida, corazón. La dejé encendida para que la vieras».": "«Ах, Рен. Рен, ты опоздал. Свет на крыльце горит уже сорок лет, милый. Я оставила его, чтобы ты его увидел».", "«Solo es caramelo».": "«Это просто конфета».", "«Te creo».": "«Я тебе верю».", "¿Empezar una partida nueva? Se borrará tu partida guardada.": "Начать новую игру? Твоё сохранение будет удалено.", "¿Otro? Nunca te llenas, ¿verdad? No. Solo hay uno.": "Ещё одну? Ты никогда не наедаешься, правда? Нет. Есть только одна.", "¿Qué dices?": "Что скажешь?", "¿Qué haces?": "Что ты делаешь?", "¿Qué serás esta noche?": "Кем ты будешь этой ночью?", "¿Treinta años? ¿Son treinta? Siempre son treinta. Mi calendario solo tiene una página.": "Тридцать лет? Это тридцать? Всегда тридцать. В моём календаре только одна страница.", "Él recorre la calle cuando la luz parpadea. Solo mira, Wren. Solo te está buscando a ti.": "Он ходит по улице, когда свет мигает. Он только смотрит, Рен. Он только ищет тебя.", "Última nota: las salas no se acaban, la ventana sí. Hay que elegir.": "Последняя записка: комнаты не кончаются, окно — кончается. Нужно выбирать.", "(tuya)": "(твоя)", "Actualizar": "Обновить", "Ajustes": "Настройки", "Alejarte": "Уйти", "Calabaza": "Тыква", "Caramelos": "Конфеты", "Cerrar": "Закрыть", "Conseguido:": "Получено:", "Continuar": "Продолжить", "Curarme": "Вылечить себя", "Despedirte": "Попрощаться", "Diario": "Дневник", "Dibujos": "Рисунки", "Encontrado:": "Найдено:", "Final": "Концовка", "Fotos": "Фото", "Guardar": "Сохранить", "Hecho.": "Готово.", "Jumpscares": "Скримеры", "Linterna (F)": "Фонарь (F)", "Mensaje": "Сообщение", "Normal": "Обычный", "Nota": "Записка", "Objetivo:": "Цель:", "Objetos": "Предметы", "Pausa": "Пауза", "Poderes": "Способности", "Recibidor": "Прихожая", "Salas": "Комнаты", "Salas (multijugador)": "Комнаты (мультиплеер)", "Sombra": "Тень", "Teletransporte": "Телепорт", "Todos": "Все", "Transformarme": "Превратиться", "Unirme": "Присоединиться", "Usuario:": "Пользователь:", "Volver": "Назад", "algo oscuro": "что-то тёмное", "llegas tarde": "ты опаздываешь", "«Pareces preocupada, Juno».": "«Ты выглядишь встревоженной, Юно».", "Biscuit": "Бисквит", "Juno": "Юно", "Wren": "Рен", "Bolsa": "Сумка", "Mapa": "Карта", "Menú": "Меню", "Yo": "Я", "Volumen": "Громкость", "Sonido:": "Звук:", "Reducir efectos:": "Меньше эффектов:", "Texto grande:": "Крупный текст:", "SÍ": "ДА", "NO": "НЕТ", "Anfitrión": "Хозяин", "tú": "ты", "Tú": "Ты", "Comer": "Съесть", "Tirar": "Выбросить", "Recuerdos": "Воспоминания", "Texto que verán los jugadores...": "Текст, который увидят игроки...", "Ir": "Идти", "Zorro": "Лиса", "Conejo": "Заяц", "Búho": "Сова", "Oso": "Медведь", "Murciélago": "Летучая мышь", "un salón amplio": "просторную гостиную", "un pasillo que gira como una L": "коридор, поворачивающий буквой Г", "un cuarto pequeño y redondo": "маленькую круглую комнату", "Resumen": "Итог"};
RU["«Wren», dices. La palabra encaja en tu boca como una llave. La linterna exhala; el Hombre del Farol pliega sus largos brazos y es solo un abrigo en un palo. La abuela Wick apaga la luz del porche por primera vez en cuarenta años."]="«Рен», — говоришь ты. Слово входит в рот, как ключ. Фонарь выдыхает; Человек-Фонарь складывает свои длинные руки и становится просто пальто на палке. Бабушка Уик выключает свет на крыльце впервые за сорок лет.";

Object.assign(RU,{"(Desde dentro, muy suave) «La llave ya la tienes, cielo... pero falta algo. Lo que llevabas puesto aquella noche. Está donde caíste. Donde empezó todo: el desagüe. Ve, y vuelve, que ya viene».": "(Изнутри, очень тихо) «Ключ у тебя уже есть, милая... но кое-чего не хватает. То, что было на тебе в ту ночь. Оно там, где ты упала. Где всё началось: в стоке. Иди и возвращайся, он уже идёт».", "Abandonar partida": "Покинуть игру", "Abres el candado con la llave nº 13 y bajas por la rejilla. El aire huele a hierro y a lluvia vieja. Muy abajo, el agua tararea la nana. Recuerda: la batería de la linterna no se recarga.": "Ты открываешь замок ключом № 13 и спускаешься по решётке. Воздух пахнет железом и старым дождём. Далеко внизу вода напевает колыбельную. Помни: батарея фонаря не заряжается.", "Abrir el candado y descender": "Открыть замок и спуститься", "Arañado en la pared: «Te buscaron en todas partes menos aquí abajo».": "Нацарапано на стене: «Тебя искали везде, кроме как здесь, внизу».", "Baja al desagüe (centro de la calle) y busca lo que perdiste.": "Спустись в сток (в центре улицы) и найди то, что потерял.", "Bajé al desagüe de la calle Marrow con la llave nº 13.": "Я спустился в сток улицы Марроу с ключом № 13.", "Boca del desagüe": "Устье стока", "Coger la manivela": "Взять рукоятку", "Coger la pulsera": "Взять браслет", "Compuerta": "Шлюз", "Cámara de las voces": "Камера голосов", "Desagüe": "Сток", "Detrás de ti el agua se mueve. Alguien ha bajado hasta aquí. No hace falta mirar para saber quién es. Sube. Sube ya.": "За спиной движется вода. Кто-то спустился сюда. Не нужно оборачиваться, чтобы знать, кто. Поднимайся. Поднимайся сейчас же.", "El cuarto de Wren. La cama está sin deshacer, pero hay una forma bajo la manta. Respira despacio. Cuando das un paso, la forma se gira hacia ti. Entonces la manta cae sola y no hay nada debajo. Solo un hueco con tu forma.": "Комната Рен. Кровать не разобрана, но под одеялом что-то лежит. Оно медленно дышит. Когда ты делаешь шаг, форма поворачивается к тебе. Потом одеяло падает само, и под ним ничего нет. Только вмятина в форме тебя.", "El fondo": "Дно", "En el fondo, medio hundida en el barro, hay una pulsera de plástico naranja con un nombre: WREN. Es la que llevabas aquella noche.": "На дне, наполовину утонув в грязи, лежит оранжевый пластиковый браслет с именем: WREN. Тот самый, что был на тебе в ту ночь.", "Encontré mi pulsera naranja en el fondo del desagüe. Lo recuerdo todo.": "Я нашёл свой оранжевый браслет на дне стока. Я всё помню.", "Encontré una manivela:": "Я нашёл рукоятку:", "Entiendes lo que es. Cada vecino que calló, cada luz que nadie apagó, juntos, buscándote. No quiere hacerte daño. Solo no sabe cómo dejar de buscar. Todo depende de lo que hagas ahora.": "Ты понимаешь, что это. Каждый сосед, что промолчал, каждый свет, который никто не погасил, — все вместе ищут тебя. Он не хочет причинить вред. Он просто не умеет перестать искать. Всё зависит от того, что ты сделаешь сейчас.", "Escalera": "Лестница", "La compuerta está atascada. La manivela tiene que estar en esta cámara. O puedes volver a subir por la escalera.": "Шлюз заклинило. Рукоятка должна быть в этой камере. Или можно подняться обратно по лестнице.", "La manivela gira con un chirrido. La compuerta se abre y el agua negra suena como voces.": "Рукоятка со скрипом поворачивается. Шлюз открывается, и чёрная вода звучит как голоса.", "La rejilla del desagüe tiene un candado con el número 13. La llave de latón encaja. Desde abajo sube un olor a lluvia vieja, y una nana muy lenta.": "На решётке стока висит замок с номером 13. Латунный ключ подходит. Снизу поднимается запах старого дождя и очень медленная колыбельная.", "Las paredes susurran. Son todas las voces de la calle repitiendo la misma frase en distintos tonos: «ya voy». «Ya voy». «Ya voy». Una de ellas es la tuya.": "Стены шепчут. Это все голоса улицы повторяют одну фразу разными тонами: «иду». «Иду». «Иду». Один из них — твой.", "Me falta algo para entrar: lo que llevaba puesto aquella noche. Está en el desagüe.": "Мне не хватает кое-чего, чтобы войти: того, что было на мне в ту ночь. Оно в стоке.", "No hay más túnel. Solo agua negra que sigue cayendo, muy abajo, hacia ningún sitio.": "Дальше туннеля нет. Только чёрная вода, которая падает всё ниже, в никуда.", "No tengo boca. Pero llevo cuarenta años aprendiendo a decir una sola frase: «¿ya puedo dejar de buscarte?».": "У меня нет рта. Но сорок лет я учусь говорить одну фразу: «можно мне перестать тебя искать?».", "Nota en el desagüe: «No entres, Wren». Es la letra de Juno.": "Записка в стоке: «Не входи, Рен». Это почерк Юно.", "Palabras arañadas en la pared: «Te buscaron en la calle, en las casas, en las ventanas. Nadie quiso mirar aquí abajo».": "Слова, нацарапанные на стене: «Тебя искали на улице, в домах, в окнах. Никто не захотел посмотреть здесь, внизу».", "Subir a la calle": "Подняться на улицу", "Trepas por la escalera y sales a la calle Marrow. El aire de la noche te sabe a gloria. Detrás de ti, la rejilla se cierra sola.": "Ты взбираешься по лестнице и выходишь на улицу Марроу. Ночной воздух кажется блаженством. Позади решётка сама закрывается.", "Túnel inundado": "Затопленный туннель", "Una manivela con el nombre «WREN» rascado en el hierro.": "Рукоятка с именем «WREN», выцарапанным на железе.", "Una manivela larga, enredada en algas negras.": "Длинная рукоятка, опутанная чёрными водорослями.", "Una manivela oxidada de válvula, colgada de una tubería.": "Ржавая рукоятка вентиля, висящая на трубе.", "Una nota pegada con alquitrán: «No entres, Wren. Aquí abajo no hay nada que quieras recordar». La letra es la de Juno.": "Записка, приклеенная смолой: «Не входи, Рен. Здесь внизу нет ничего, что ты хотел бы вспомнить». Это почерк Юно.", "Y entonces lo recuerdas todo. La lluvia. El atajo de la Sra. Pim. La tuba del Sr. Bellows tapando tus gritos. Juno, en la ventana, sin decir nada. El agua, tan fría. Y arriba, una luz de porche encendida esperándote durante cuarenta años.": "И тогда ты вспоминаешь всё. Дождь. Короткий путь миссис Пим. Туба мистера Беллоуза, заглушающая твои крики. Юно в окне, ничего не говорящая. Вода, такая холодная. И наверху свет на крыльце, ждущий тебя сорок лет.", "algo respira detrás de ti": "что-то дышит у тебя за спиной", "alguien golpea las paredes": "кто-то стучит по стенам", "la luz se ha ido": "свет погас", "¿Abandonar la partida?": "Покинуть игру?", "Saldrás también de la sala.": "Ты также выйдешь из комнаты.", "Sí": "Да", "No": "Нет", "ji, ji, ji": "хи, хи, хи", "Salir de la sala": "Выйти из комнаты"});
Object.assign(RU,{"Clave de DIOS-M": "Ключ DIOS-M", "Escribe la clave:": "Введи ключ:", "Verificar": "Проверить", "Clave incorrecta.": "Неверный ключ."});
Object.assign(RU,{"Usar (−miedo)": "Использовать (−страх)", "Abres el frasco y el humo se convierte en un gato que se va. Respiras mejor.": "Ты открываешь флакон, и дым превращается в кота, который уходит. Дышать легче.", "Abrir el aparador": "Открыть буфет", "Abrí la caja fuerte (714): un muelle y la llave del reloj.": "Я открыл сейф (714): пружина и ключ от часов.", "Acertijo del aparador: la oscuridad. Conseguí la llave negra.": "Загадка буфета: темнота. Я получил чёрный ключ.", "Acertijo del vestíbulo: un reloj.": "Загадка холла: часы.", "Aguja": "Стрелка", "Ahora estás dentro. Si el reloj vuelve a marcar las doce, la noche termina. Pero él no te dejará.": "Теперь ты внутри. Если часы снова пробьют двенадцать, ночь закончится. Но он тебе не позволит.", "Al fondo se alza una mansión negra y gris, con la torre de un reloj parado a las doce menos un minuto.": "В глубине возвышается чёрно-серый особняк, на башне которого часы остановились без минуты двенадцать.", "Al otro lado de la valla no hay calle Marrow. Solo un camino de ceniza y una verja oxidada.": "По ту сторону забора нет улицы Марроу. Только пепельная тропа и ржавая ограда.", "Aparador": "Буфет", "Azúcar curativa (+50 de vida)": "Целебный сахар (+50 жизни)", "Biblioteca": "Библиотека", "Buhonero": "Коробейник", "Busca un fusible en la biblioteca. La caja de fusibles está en la pared.": "Найди предохранитель в библиотеке. Щиток на стене.", "Caja de fusibles": "Щиток с предохранителями", "Caja fuerte": "Сейф", "Carta": "Письмо", "Carta del Relojero: guardó las luces de los niños para no perderlos.": "Письмо Часовщика: он сохранил огоньки детей, чтобы не потерять их.", "Cerradura negra. Necesitas una llave negra.": "Чёрный замок. Нужен чёрный ключ.", "Cientos de libros perfectamente ordenados. Solo uno está al revés. Su título: «El Uno».": "Сотни книг в идеальном порядке. Только одна стоит вверх ногами. Название: «Единица».", "Clic. La caja se abre. Dentro: un muelle brillante y una llave del reloj, de oro viejo. Al fondo, algo hace «tic».": "Щелчок. Сейф открывается. Внутри: блестящая пружина и ключ от часов из старого золота. В глубине что-то делает «тик».", "Coger el engranaje": "Взять шестерёнку", "Colocas el engranaje, el muelle y la aguja. Metes la llave y algo en las paredes despierta. Hay que darle cuerda cinco veces. Él ya viene.": "Ты ставишь шестерёнку, пружину и стрелку. Вставляешь ключ, и что-то в стенах просыпается. Нужно завести часы пять раз. Он уже идёт.", "Colocas el fusible. Las luces parpadean y, al fondo, una cerradura eléctrica hace «clac».": "Ты ставишь предохранитель. Свет мигает, и в глубине электрический замок говорит «щёлк».", "Comedor": "Столовая", "Crucé la valla rota. Del otro lado hay una mansión negra y gris.": "Я пересёк сломанный забор. По ту сторону чёрно-серый особняк.", "Cruzar la valla rota": "Пересечь сломанный забор", "Código incorrecto. La caja emite un pitido agudo.": "Неверный код. Сейф издаёт пронзительный писк.", "Dale cuerda al reloj gigante. ¡Escóndete cuando él se acerque!": "Заведи гигантские часы. Прячься, когда он приближается!", "Despacho": "Кабинет", "Diez años. En una esquina del cuadro hay un desagüe pintado.": "Десять лет. В углу картины нарисован сток.", "Dos caramelos grises, fríos, enterrados en la ceniza.": "Две серые конфеты, холодные, закопанные в пепле.", "E: saltar": "E: пропустить", "EL AMANECER": "РАССВЕТ", "El Buhonero": "Коробейник", "El Relojero": "Часовщик", "El aparador está vacío.": "Буфет пуст.", "El cajón se abre solo. Dentro hay una llave negra, fría como el hielo.": "Ящик открывается сам. Внутри чёрный ключ, холодный как лёд.", "El marco se desplaza. Detrás hay una aguja de reloj, la de las horas, caliente como una brasa.": "Рамка сдвигается. За ней стрелка часов, часовая, горячая как уголь.", "El reloj está parado a las 11:59. Le faltan piezas:": "Часы остановились на 11:59. Не хватает деталей:", "El tiempo": "Время", "El vestíbulo huele a polvo y a metal. Un reloj de pie, parado, tictaquea sin moverse. Tu linterna es tu única luz. Busca objetos, resuelve los acertijos y escapa antes de que él te encuentre.": "В холле пахнет пылью и металлом. Напольные часы, остановившиеся, тикают, не двигаясь. Твой фонарь — единственный свет. Ищи предметы, разгадывай загадки и беги, пока он тебя не нашёл.", "En el cajón, entre plumas muertas, hay un fusible de cerámica.": "В ящике, среди мёртвых перьев, лежит керамический предохранитель.", "En el comedor, el aparador guarda una llave. Su acertijo habla de la oscuridad.": "В столовой в буфете хранится ключ. Его загадка — о темноте.", "En la galería, un retrato esconde algo. Mira el que no tiene edad.": "В галерее один портрет что-то скрывает. Посмотри на тот, у которого нет возраста.", "En la torre, coloca engranaje, muelle, aguja y llave en el reloj gigante.": "В башне поставь шестерёнку, пружину, стрелку и ключ в гигантские часы.", "Encontré un engranaje oxidado en el vestíbulo.": "Я нашёл ржавую шестерёнку в холле.", "Encontré un fusible en la biblioteca.": "Я нашёл предохранитель в библиотеке.", "Engranaje": "Шестерёнка", "Entra por la puerta principal de la mansión Tictac.": "Войди через главную дверь особняка Тик-так.", "Entra por la puerta principal de la mansión.": "Войди через главную дверь особняка.", "Entrar en la mansión": "Войти в особняк", "Entre el polvo hay un incienso raro que huele a pastel quemado.": "Среди пыли лежит странное благовоние, пахнущее подгоревшим пирогом.", "Entre la casa nº 7 y la nº 9 se abre un hueco de niebla gris. Del otro lado, algo te espera.": "Между домами № 7 и № 9 открывается провал серого тумана. По ту сторону тебя что-то ждёт.", "Entré en la mansión Tictac. La puerta se cerró detrás de mí.": "Я вошёл в особняк Тик-так. Дверь закрылась за мной.", "Esconderte en el armario": "Спрятаться в шкафу", "Estantería": "Книжный шкаф", "Ezequiel Tictac ya no es nada: un abrigo gris sobre una silla y un reloj que, por fin, marca las doce y un minuto. Un zorrito sale de la mansión, estira los brazos y sigue a las luces. La luz del nº 13 se apaga sola.": "Эзекиэль Тик-так больше ничто: серое пальто на стуле и часы, которые наконец показывают двенадцать и одну минуту. {d} выходит из особняка, потягивается и идёт за огоньками. Свет дома № 13 гаснет сам.", "Fusible": "Предохранитель", "Galería de retratos": "Галерея портретов", "Giras la llave por última vez. El reloj gigante late como un corazón enorme.": "Ты поворачиваешь ключ в последний раз. Гигантские часы бьются, как огромное сердце.", "Hablar con el Buhonero": "Поговорить с Коробейником", "Hace cuarenta años, un relojero llamado Ezequiel Tictac no soportaba que los niños crecieran.": "Сорок лет назад часовщик Эзекиэль Тик-так не мог вынести, что дети растут.", "Huele a caramelo quemado y a abrazo. Algo dentro de ti se calma.": "Пахнет жжёной карамелью и объятием. Что-то внутри тебя успокаивается.", "Humo en Frasco": "Дым во Флаконе", "Incienso de Luciérnaga": "Благовоние Светлячка", "Incienso raro": "Странное благовоние", "Inciensos raros": "Странные благовония", "Inés": "Инес", "La caja de fusibles está vacía. Falta un fusible.": "В щитке пусто. Не хватает предохранителя.", "La caja fuerte del despacho necesita tres cifras: velas, libro, sillas.": "Для сейфа в кабинете нужны три цифры: свечи, книга, стулья.", "La caja fuerte está abierta y vacía.": "Сейф открыт и пуст.", "La caja zumba. La puerta de la derecha tiene corriente.": "Щиток гудит. На двери справа есть ток.", "La cerradura chasquea. «Correcto... Tic, tac». La puerta se abre.": "Замок щёлкает. «Верно... Тик-так». Дверь открывается.", "La llama habla con tu voz y dice que no pasa nada. Tu miedo se derrite, pero te arde la garganta.": "Пламя говорит твоим голосом и уверяет, что всё хорошо. Страх тает, но в горле жжёт.", "La niebla": "Туман", "La noche termina. Por primera vez en cuarenta años el sol sale sobre la calle Marrow. Las luces de los niños perdidos se van al cielo una a una, y los vecinos, por fin, pueden apagar sus porches.": "Ночь заканчивается. Впервые за сорок лет над улицей Марроу встаёт солнце. Огоньки потерянных детей уходят в небо один за другим, и соседи наконец могут погасить свои крыльца.", "La oscuridad": "Темнота", "La placa está vacía.": "Табличка пуста.", "La puerta de la mansión se cerró detrás de mí. Tengo que encontrar otra salida.": "Дверь особняка закрылась за мной. Мне нужно найти другой выход.", "La puerta de la torre está sellada. Algo en este despacho la abre.": "Дверь башни запечатана. Что-то в этом кабинете её открывает.", "La puerta principal se cerró sola y no tiene pomo por dentro. Esta casa no te deja salir tan fácil.": "Главная дверь закрылась сама, и изнутри у неё нет ручки. Этот дом не отпускает так просто.", "La puerta tiene una cerradura eléctrica apagada. Falta corriente: busca una caja de fusibles.": "У двери выключенный электрический замок. Нет тока: найди щиток с предохранителями.", "La valla de madera cruje. Algo muy pesado la empuja desde el otro lado.": "Деревянный забор скрипит. Что-то очень тяжёлое давит на него с той стороны.", "La valla entre el nº 7 y el nº 9 está rota. ¿Qué habrá al otro lado?": "Забор между домами № 7 и № 9 сломан. Что же за ним?", "La valla entre el nº 7 y el nº 9 se rompió sola.": "Забор между домами № 7 и № 9 сломался сам.", "Las doce menos un minuto, por fin, se convierten en las doce. Todos los relojes de la calle Marrow dan la hora a la vez.": "Без минуты двенадцать наконец превращается в двенадцать. Все часы на улице Марроу бьют разом.", "Las luces de los niños perdidos se fueron hacia su mansión, una a una, como luciérnagas.": "Огоньки потерянных детей уплыли к его особняку, один за другим, как светлячки.", "Las luces de los niños suben desde la mansión como luciérnagas hacia un cielo que empieza a clarear. El Relojero grita, y se deshace en polvo y en tic-tac.": "Огоньки детей поднимаются из особняка, как светлячки, в небо, которое начинает светлеть. Часовщик кричит и рассыпается в пыль и тик-так.", "Las manecillas marcan las 11:59 y no se mueven. Grabado en la caja: «Siete velas encendidas guardan al último niño».": "Стрелки показывают 11:59 и не двигаются. На корпусе выгравировано: «Семь горящих свечей хранят последнего ребёнка».", "Las tablas se rompen una a una, sin ruido, como si llevaran años queriendo caer.": "Доски ломаются одна за другой, без звука, будто годами хотели упасть.", "Leer la carta": "Прочитать письмо", "Leer la placa": "Прочитать табличку", "Llave del reloj": "Ключ от часов", "Llave negra": "Чёрный ключ", "Los caramelos también sirven como moneda. Comer te cambia a ti y a la calle. No todas las casas son lo que parecen. Sé curioso. Algunas decisiones no se pueden deshacer. La noche lo recuerda.": "Конфеты ещё и служат монетой. Еда меняет тебя и улицу. Не все дома такие, какими кажутся. Будь любопытен. Некоторые решения нельзя отменить. Ночь помнит.", "Lía": "Лия", "MANSIÓN TICTAC. «Aquí el tiempo se detiene». Debajo, rascado con una uña: «no entres».": "ОСОБНЯК ТИК-ТАК. «Здесь время останавливается». Ниже, выцарапано ногтем: «не входи».", "Mansión (exterior)": "Особняк (снаружи)", "Mansión (interior)": "Особняк (внутри)", "Mansión Tictac": "Особняк Тик-так", "Mesa": "Стол", "Mirar el reloj de pie": "Осмотреть напольные часы", "Mirar el retrato": "Осмотреть портрет", "Mirar la estantería": "Осмотреть книжный шкаф", "Mirar la mesa": "Осмотреть стол", "Muelle": "Пружина", "No hay más puertas. Solo el reloj gigante, parado a las 11:59.": "Больше дверей нет. Только гигантские часы, остановившиеся на 11:59.", "No tienes suficientes caramelos.": "У тебя недостаточно конфет.", "Nueve años. Sonríe, pero sus ojos miran hacia el reloj.": "Девять лет. Она улыбается, но глаза смотрят на часы.", "Objetos de la mansión": "Предметы особняка", "Ocho años. Sostiene una linterna de papel apagada.": "Восемь лет. Он держит погасший бумажный фонарик.", "Pequeñas luces te rodean y susurran números. Tu miedo se aquieta.": "Маленькие огоньки окружают тебя и шепчут числа. Страх затихает.", "Pila para la linterna (+60%)": "Батарея для фонаря (+60%)", "Pista de la caja fuerte: cuatro sillas.": "Подсказка к сейфу: четыре стула.", "Pista de la caja fuerte: siete velas encendidas.": "Подсказка к сейфу: семь горящих свечей.", "Pista de la caja fuerte: solo un libro está al revés.": "Подсказка к сейфу: только одна книга стоит вверх ногами.", "Pista del Buhonero": "Подсказка Коробейника", "Placa": "Табличка", "Probar": "Попробовать", "Recoger algo raro": "Подобрать что-то странное", "Reloj de pie": "Напольные часы", "Reloj gigante": "Гигантские часы", "Resuelve el acertijo de la puerta del vestíbulo. Habla del tiempo.": "Разгадай загадку на двери холла. Она о времени.", "Retrato": "Портрет", "Retrato:": "Портрет:", "Retrato: Wren": "Портрет: Рен", "Revisar el cajón": "Проверить ящик", "Salir del armario": "Выйти из шкафа", "Sin edad. El marco está más limpio que los demás. Alguien lo toca cada noche.": "Без возраста. Рамка чище остальных. Кто-то трогает её каждую ночь.", "Tic... (": "Тик... (", "Tomás": "Томас", "Torre del reloj": "Часовая башня", "Tras el retrato de Wren había una aguja de reloj.": "За портретом Рен была стрелка часов.", "Trato hecho.": "Договорились.", "Tres cifras. Velas, libro, sillas.": "Три цифры. Свечи, книга, стулья.", "Tus caramelos:": "Твои конфеты:", "Un engranaje oxidado, tibio, como si hubiera estado girando hasta hace un momento.": "Ржавая шестерёнка, тёплая, будто ещё недавно вертелась.", "Un fantasma": "Привидение", "Un hombre alto y delgado con gafas de engranajes sonríe demasiado. Bajo el marco: «Ezequiel Tictac, relojero. El tiempo es mío».": "Высокий худой человек в очках из шестерёнок улыбается слишком широко. Под рамой: «Эзекиэль Тик-так, часовщик. Время принадлежит мне».", "Un reloj": "Часы", "Una marioneta": "Марионетка", "Una mesa puesta para cuatro. Tres sillas están vacías; en la cuarta, una taza de té aún humea.": "Стол накрыт на четверых. Три стула пусты; на четвёртом ещё дымится чашка чая.", "Una noche de Halloween detuvo todos los relojes de la calle Marrow. A las doce menos un minuto. Para siempre.": "В ночь на Хэллоуин он остановил все часы на улице Марроу. Без минуты двенадцать. Навсегда.", "Una silueta alta y delgada entra en la sala. Dos cristales de gafas brillan como engranajes. Camina arrastrando algo que hace «tic, tac». Es él. Es el Relojero.": "В комнату входит высокий худой силуэт. Два стекла очков блестят, как шестерёнки. Он идёт, волоча что-то, что делает «тик-так». Это он. Это Часовщик.", "Una sola ventana tiene luz. Alguien lleva cuarenta años esperando una visita.": "Светится только одно окно. Кто-то сорок лет ждёт гостя.", "Una tarjeta en el cajón dice: «Cuanto más hay, menos ves. ¿Qué es?»": "Карточка в ящике: «Чем больше её, тем меньше ты видишь. Что это?»", "Una voz de metal, desde la cerradura: «Tengo manos pero no aplaudo. Tengo cara pero no sonrío. Tengo horas pero no duermo. ¿Qué soy?»": "Металлический голос из замка: «У меня есть руки, но я не аплодирую. У меня есть лицо, но я не улыбаюсь. У меня есть часы, но я не сплю. Кто я?»", "Varita de Ceniza Dulce": "Палочка Сладкого Пепла", "Vela de Lengua Negra": "Свеча Чёрного Языка", "Vestíbulo": "Холл", "Volver a la calle": "Вернуться на улицу", "de 6 encontrado.": "из 6 найдено.", "el engranaje": "шестерёнку", "el muelle": "пружину", "la aguja": "стрелку", "la llave del reloj": "ключ от часов", "«Incorrecto». Algo, muy lejos, ha empezado a caminar hacia ti.": "«Неверно». Что-то очень далёкое начало идти к тебе.", "«Los niños fueron colgados por orden de llegada. Uno nunca llegó: está escondido a la vista. ¿Qué retrato esconde algo?»": "«Детей повесили в порядке прибытия. Один так и не прибыл: он спрятан на виду. Какой портрет что-то скрывает?»", "«Psst... ¿caramelos? Yo cambio cosas raras por caramelos buenos».": "«Тсс... конфеты? Я меняю странные вещи на хорошие конфеты».", "«Si lees esto, ya estás dentro. Guardé las luces de los niños porque nadie los cuidaba como yo. Detuve el reloj para no perderlos. Hay una pieza en cada habitación y una llave en cada cerradura. Pero la torre no es para ti. — E. Tictac»": "«Если ты это читаешь, ты уже внутри. Я сохранил огоньки детей, потому что никто не заботился о них так, как я. Я остановил часы, чтобы не потерять их. В каждой комнате есть деталь, в каждом замке ключ. Но башня не для тебя. — Э. Тик-так»", "Él las guarda en un reloj gigante. Cada engranaje es una luz. Cada tic, un niño que no puede irse.": "Он хранит их в гигантских часах. Каждая шестерёнка — огонёк. Каждый тик — ребёнок, который не может уйти.", "Retrato: ": "Портрет: ", "Tictac": "Тик-так"});
